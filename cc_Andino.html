        function renderizarMatriz() {
            const textoBusqueda = buscador.value.toLowerCase().trim();
            const grupoSeleccionado = filtroGrupo.value;
            
            grid.innerHTML = '';
            let contadorVisibles = 0;

            listaIphones.forEach((item, index) => {
                const coincideBusqueda = item.modelo.toLowerCase().includes(textoBusqueda);
                const coincideGrupo = (grupoSeleccionado === 'todos') || (item.grupo === grupoSeleccionado);

                if (coincideBusqueda && coincideGrupo) {
                    contadorVisibles++;
                    const numeroDex = String(index + 1).padStart(3, '0');

                    // 1. DETERMINAR EL TIPO DE PANTALLA (Evaluando el 'grupo' de la listaIphones)
                    let tipoPantalla = '';

                    // Convertimos a minúsculas para comparar con seguridad y ver si NO es de la familia Apple
                    if (item.grupo.toLowerCase() !== 'apple' && !item.grupo.toLowerCase().includes('iphone')) {
                        // SI NO ES APPLE/IPHONE: Cualquier otra marca o grupo usa muesca tipo gota
                        tipoPantalla = 'notch-gota'; 
                    } else {
                        // SI SÍ ES APPLE/IPHONE: Mantenemos tu lógica original para las muescas de Apple
                        
                        // Si es un modelo 'e' (16e o 17e) -> Notch clásico
                        if (item.modelo.includes('16e') || item.modelo.includes('17e')) {
                            tipoPantalla = 'notch'; 
                        } 
                        // Si es un modelo con Isla Dinámica
                        else if (
                            item.modelo.includes('Air') ||
                            item.modelo.includes('14 Pro') || 
                            item.modelo.includes('15') || 
                            item.modelo.includes('16') || 
                            item.modelo.includes('17')
                        ) {
                            tipoPantalla = 'isla-dinamica';
                        }
                        // Si es de los modelos antiguos clásicos -> Botón Home
                        else if (
                            item.modelo.includes('iPhone 5') ||
                            item.modelo.includes('iPhone 6') ||
                            item.modelo.includes('iPhone 7') ||
                            item.modelo.includes('iPhone 8') ||
                            item.modelo.includes('iPhone SE')
                        ) {
                            tipoPantalla = 'boton-home';
                        }
                        // Cualquier otro intermedio (X, XR, XS, 11, 12, 13) -> Notch clásico
                        else {
                            tipoPantalla = 'notch';
                        }
                    }

                    // 2. Definimos el HTML interno del elemento según el tipo de pantalla
                    let elementoPantalla = '';
                    if (tipoPantalla === 'notch-gota') {
                        elementoPantalla = '<div class="notch-gota"></div>'; 
                    } else if (tipoPantalla === 'isla-dinamica') {
                        elementoPantalla = '<div class="isla-dinamica"></div>';
                    } else if (tipoPantalla === 'notch') {
                        elementoPantalla = '<div class="notch"></div>';
                    } else if (tipoPantalla === 'boton-home') {
                        elementoPantalla = '<div class="boton-home"></div>';
                    }
                    
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-pokemon';
                    tarjeta.innerHTML = `
                        <div class="pokemon-id">#${numeroDex}</div>
                        <div class="imagen-contenedor">
                            <div class="smartphone-icon ${tipoPantalla === 'boton-home' ? 'estilo-clasico' : ''}">
                                ${elementoPantalla}
                            </div>
                        </div>
                        <div class="marca">${item.grupo}</div>
                        <div class="modelo">${item.modelo}</div>
                    `;
                    
                    tarjeta.addEventListener('click', () => {
                        window.location.href = `detalles.html?modelo=${encodeURIComponent(item.modelo)}`;
                    });
                    grid.appendChild(tarjeta);
                }
            });

            if (contadorVisibles === 0) noResultados.classList.remove('oculto');
            else noResultados.classList.add('oculto');
        }
